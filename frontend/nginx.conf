server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================
    # Gzip 压缩
    # =========================

    gzip on;

    # 压缩级别：
    # 1 最快、压缩率最低
    # 9 最慢、压缩率最高
    # 6 通常是比较好的平衡点。
    gzip_comp_level 6;

    # 小于 1KB 的响应不压缩。
    gzip_min_length 1024;

    # 告诉代理/CDN：
    # 响应是否压缩取决于 Accept-Encoding。
    gzip_vary on;

    # 对代理请求也允许压缩。
    gzip_proxied any;

    # 需要压缩的 MIME 类型。
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Vue Router 使用 history 模式时，
    # /rating/1、/score/1 等前端路由直接访问或刷新，
    # 都需要回退到 index.html 交给 Vue Router 处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}